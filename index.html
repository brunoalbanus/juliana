<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Juliana ❤️ Marcos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@1,500;1,600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(165deg, #fff6f1 0%, #fde4d9 50%, #f9d0c1 100%);
    color: #7a4a40;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .heart {
    position: absolute; bottom: -40px; font-size: 22px; opacity: .75; line-height: 1;
    animation: rise linear forwards;
  }
  @keyframes rise {
    to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }
  .card {
    position: relative; z-index: 1;
    background: rgba(255,253,250,.82);
    backdrop-filter: blur(6px);
    border-radius: 28px;
    padding: 44px 28px 48px; border: 1px solid rgba(233,150,128,.3);
    width: min(88vw, 420px);
    text-align: center;
    box-shadow: 0 20px 50px rgba(190, 110, 90, .18);
  }
  .names {
    font-family: 'Great Vibes', cursive;
    font-size: 38px; color: #df8d78; margin-bottom: 4px;
  }
  .big-heart { font-size: 46px; color: #f0a08b; line-height: 1; animation: beat 1.2s infinite; display: inline-block; }
  @keyframes beat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.18)} 30%{transform:scale(1)} 45%{transform:scale(1.12)} }
  h1 {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600;
    font-size: clamp(36px, 10vw, 46px);
    line-height: 1.15; margin: 18px 0 0; color: #9a5848;
  }
  button {
    font-family: 'Poppins', sans-serif; font-weight: 600;
    font-size: 18px; border: none; border-radius: 999px;
    padding: 14px 34px; cursor: pointer;
    transition: transform .15s;
  }
  .intro { position: relative; z-index: 1; text-align: center; transition: opacity .6s ease, transform .6s ease; }
  .intro.saindo { opacity: 0; transform: scale(1.08); }
  .para { font-family: 'Great Vibes', cursive; font-size: 44px; color: #b46a58; margin-bottom: 26px; }
  .hint { margin-top: 28px; font-size: 14px; letter-spacing: .08em; color: #b46a58; opacity: .8; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .env { position: relative; width: min(78vw, 300px); aspect-ratio: 3 / 2; margin: 0 auto; cursor: pointer; perspective: 900px; animation: bob 2.4s ease-in-out infinite; }
  .env.aberto { animation: none; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .env-back { position: absolute; inset: 0; background: #e39985; border-radius: 10px; box-shadow: 0 18px 40px rgba(190,110,90,.25); }
  .env-front { position: absolute; inset: 0; border-radius: 10px; z-index: 3;
    background: linear-gradient(135deg, #fbd5c8, #f5bfae);
    clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%); }
  .env-flap { position: absolute; left: 0; right: 0; top: 0; height: 62%; z-index: 4; background: #fde3d9;
    clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .7s ease; border-radius: 10px 10px 0 0; }
  .env.aberto .env-flap { transform: rotateX(180deg); z-index: 1; }
  .seal { position: absolute; left: 50%; top: 62%; transform: translate(-50%, -50%); z-index: 5; font-size: 30px; color: #e0806a; line-height: 1; transition: opacity .3s; }
  .env.aberto .seal { opacity: 0; }
  .letter { position: absolute; left: 8%; right: 8%; top: 8%; height: 84%; background: #fffaf5; border-radius: 6px; z-index: 2; color: #f0a08b;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 10%; font-size: 28px;
    transition: transform .8s ease .55s; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .env.aberto .letter { transform: translateY(-62%); }
  .fade-in { animation: fadeIn .6s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  #som { display: none; position: fixed; top: 16px; right: 16px; z-index: 10; padding: 10px 14px; font-size: 20px; background: rgba(255,253,250,.9); box-shadow: 0 4px 12px rgba(190,110,90,.18); color: #b46a58; }
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<audio id="musica" src="musica.mp3" preload="auto" loop></audio>
<button id="som" aria-label="Som">🔊</button>

<div class="intro" id="intro">
  <div class="para">Para Juliana</div>
  <div class="env" id="abrir" role="button" aria-label="Abrir cartão">
    <div class="env-back"></div>
    <div class="letter"><span>♥</span></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="seal">♥</div>
  </div>
  <div class="hint">toque para abrir</div>
</div>

<div class="card" id="pergunta" style="display:none">
  <div class="names">Juliana &amp; Marcos</div>
  <div class="big-heart">♥</div>
  <h1>Quer namorar comigo?</h1>
</div>


<script>
  const heartsBox = document.getElementById('hearts');
  const cores = ['#f5b2a0','#f9c8b6','#f29d86','#fcd8c6','#f7bba9','#fbe0cf'];
  function spawnHeart(burst) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = '♥';
    h.style.color = cores[Math.floor(Math.random()*cores.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (burst ? 22 + Math.random()*26 : 16 + Math.random()*14) + 'px';
    h.style.animationDuration = (burst ? 3 + Math.random()*2 : 7 + Math.random()*5) + 's';
    heartsBox.appendChild(h);
    setTimeout(() => h.remove(), 13000);
  }
  let ambient = setInterval(() => spawnHeart(false), 700);

  document.getElementById('som').addEventListener('click', (e) => {
    const m = document.getElementById('musica');
    if (m.paused) { m.play().catch(() => {}); e.target.textContent = '🔊'; }
    else { m.pause(); e.target.textContent = '🔇'; }
  });
  document.getElementById('abrir').addEventListener('click', () => {
    if (document.getElementById('abrir').classList.contains('aberto')) return;
    const m = document.getElementById('musica');
    m.volume = 0;
    m.play().then(() => {
      document.getElementById('som').style.display = 'block';
      let v = 0; const f = setInterval(() => { v = Math.min(v + 0.05, 1); m.volume = v; if (v >= 1) clearInterval(f); }, 100);
    }).catch(() => {});
    const env = document.getElementById('abrir');
    if (env.classList.contains('aberto')) return;
    env.classList.add('aberto');
    document.querySelector('.hint').style.visibility = 'hidden';
    setTimeout(() => document.getElementById('intro').classList.add('saindo'), 1700);
    setTimeout(() => {
      document.getElementById('intro').style.display = 'none';
      const q = document.getElementById('pergunta');
      q.style.display = 'block'; q.classList.add('fade-in');
      for (let i = 0; i < 40; i++) setTimeout(() => spawnHeart(true), i * 60);
    }, 2300);
  });
</script>
</body>
</html>
